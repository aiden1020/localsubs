name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "extension-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows native verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install extension dependencies
        run: npm ci

      - name: Run Windows Go tests
        run: go test ./...

      - name: Run extension tests
        run: npm test

      - name: Test Windows Native Messaging protocol
        run: npm run test:integration

      - name: Build and smoke-test Windows helper
        shell: pwsh
        run: |
          go build -o dist/localsubs.exe ./cmd/localsubs
          ./dist/localsubs.exe version
          ./dist/localsubs.exe runtime status --json

      - name: Test Edge Native Messaging end to end
        run: npm run test:e2e:windows -- --browser edge --fake-backend

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install extension dependencies
        run: npm ci

      - name: Check extension and helper versions, store listing limits and JavaScript syntax
        run: npm run check
        env:
          LOCALSUBS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - name: Run extension tests
        run: npm test

      - name: Run Go tests
        run: go test ./...

      - name: Run Go race tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Test Native Messaging integration
        run: npm run test:integration

      - name: Test release version injection
        run: npm run test:version-injection

      - name: Pin GoReleaser to helper release tags
        run: node scripts/goreleaser-tags.mjs

      # v2.16 fully deprecated binary-only Homebrew formulas in favor of casks.
      # LocalSubs pins v2.15 while preserving the existing Formula upgrade path.
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.2
          args: check

      - name: Build GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.2
          args: release --snapshot --clean

      - name: Smoke-test GoReleaser snapshot
        run: npm run smoke:goreleaser

      # GoReleaser --clean removes dist/, so build the uploadable extension
      # artifact only after the release snapshot has been verified.
      - name: Build extension package
        run: npm run package:extension

      - name: Smoke-test extension package
        run: npm run smoke:extension

      - name: Check reproducible extension packaging
        run: npm run check:extension-reproducibility

      - name: Check formatting
        run: git diff --check

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: localsubs-chrome-extension
          path: dist/localsubs-chrome-extension-v*.zip
          if-no-files-found: error

  release:
    name: Publish helper release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pin GoReleaser to helper release tags
        run: node scripts/goreleaser-tags.mjs

      - name: Publish with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.15.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Generate WinGet manifests from the published archive
        run: |
          node scripts/generate-winget-manifests.mjs \
            --version "${GITHUB_REF_NAME#v}" \
            --installer dist/localsubs_windows_amd64.zip \
            --output dist/winget

      - name: Upload WinGet submission manifests
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-${{ github.ref_name }}
          path: dist/winget/*.yaml
          if-no-files-found: error

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/localsubs_*.tar.gz
            dist/localsubs_*.zip
            dist/checksums.txt

  release-extension:
    name: Publish extension release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/extension-v')
    needs: [verify, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download verified extension package
        uses: actions/download-artifact@v4
        with:
          name: localsubs-chrome-extension
          path: dist/extension

      - name: Attest extension package
        uses: actions/attest@v4
        with:
          subject-path: dist/extension/*.zip

      # Helper releases stay "Latest" so install instructions that link to the
      # latest release keep pointing at the helper archives.
      - name: Publish the extension package as its own GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/extension/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest=false \
            --title "LocalSubs extension ${GITHUB_REF_NAME#extension-v}" \
            --notes "Chrome Web Store package for LocalSubs extension ${GITHUB_REF_NAME#extension-v}. See CHANGELOG.md for the changes."
        env:
          GH_TOKEN: ${{ github.token }}
